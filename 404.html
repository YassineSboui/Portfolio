<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Yassine Sboui</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d0d0f" />
    <link rel="icon" type="image/png" href="/Portfolio/assets/img/favicon-64.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Instrument+Serif&family=JetBrains+Mono:wght@400&display=swap"
    />
    <style>
      /* Self-contained on purpose: a 404 is served for a bad asset path as well as a bad
         page, so it must not depend on the stylesheet that may be what went missing. */
      :root { --bg: #0d0d0f; --text: #ece8e1; --dim: #a5a09a; --faint: #8a847c;
              --rule: rgba(236, 232, 225, 0.16); --accent: oklch(0.8 0.085 78); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh; display: grid; place-content: center; gap: 1.4rem;
        padding: 2rem 1.5rem; background: var(--bg); color: var(--text);
        font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      }
      .rail { display: flex; align-items: center; gap: 1rem; font-family: 'JetBrains Mono', monospace;
              font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); }
      .rail span:nth-child(2) { flex: 1; height: 1px; background: var(--rule); min-width: 4rem; }
      h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400;
           font-size: clamp(2.6rem, 9vw, 4.4rem); line-height: 1.04; }
      p { color: var(--dim); max-width: 44ch; line-height: 1.6; }
      a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor;
          padding-bottom: 2px; font-family: 'JetBrains Mono', monospace; font-size: 0.86rem;
          display: inline-flex; align-items: center; min-height: 44px; }
    </style>
  </head>
  <body>
    <p class="rail"><span>Error</span><span></span><span>404</span></p>
    <h1>That page isn't here.</h1>
    <p>The link is stale or mistyped. The work is all on one page — seven products, each with a demo.</p>
    <p><a href="/Portfolio/">Go to the portfolio &#8599;</a></p>
  </body>
</html>
