<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Yassine Sboui</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a1424" />
    <link rel="icon" type="image/png" href="/Portfolio/assets/img/favicon-64.png" />
    <style>
      @font-face { font-family: 'Archivo'; font-weight: 300 800; font-stretch: 62% 125%; font-display: swap; src: url('/Portfolio/assets/fonts/archivo-latin-var.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Sans'; font-weight: 400 600; font-display: swap; src: url('/Portfolio/assets/fonts/ibm-plex-sans-latin-var.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-display: swap; src: url('/Portfolio/assets/fonts/ibm-plex-mono-400-latin.woff2') format('woff2'); }
      :root { --paper: #0a1424; --ink: #e4ecf7; --ink-2: #aab9cf; --ink-3: #8195b3; --line: #74abff; --mark: #ffd166;
              --grid: rgba(130, 170, 230, 0.07); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-content: center; gap: 1.3rem; padding: 2rem 1.5rem;
             background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.6 'IBM Plex Sans', system-ui, sans-serif;
             background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
             background-size: 32px 32px; -webkit-font-smoothing: antialiased; }
      .prompt { font: 400 0.9rem/1.4 'IBM Plex Mono', monospace; color: var(--ink-3); word-break: break-all; }
      .prompt b { font-weight: 400; color: var(--mark); }
      .prompt i { font-style: normal; color: var(--line); }
      h1 { font: 760 clamp(2.4rem, 8vw, 4.6rem)/0.95 Archivo, 'Arial Narrow', sans-serif; font-stretch: 120%; letter-spacing: -0.025em; }
      p { color: var(--ink-2); max-width: 44ch; }
      nav { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 0.4rem; }
      a { display: inline-flex; align-items: center; min-height: 46px; padding: 0.7rem 1.1rem; font-weight: 600;
          color: var(--ink); text-decoration: none; border: 1px solid rgba(160, 190, 235, 0.25); }
      a:first-child { background: var(--mark); border-color: var(--mark); color: #1b1500; }
      a:focus-visible { outline: 2px solid var(--line); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <p class="prompt">~/portfolio <b>$</b> cd <i id="asked">this-page</i><br />no such file or directory</p>
    <h1>That page isn't here.</h1>
    <p>The link is stale or mistyped. Everything on the site is one click from the home page or the project archive.</p>
    <nav aria-label="Where to go"><a href="/Portfolio/">Go to the home page</a><a href="/Portfolio/projects.html">See all projects</a></nav>
    <script>var p = location.pathname.replace(/^\/Portfolio\/?/, ''); try { p = decodeURIComponent(p) } catch (_) {} document.getElementById('asked').textContent = p || 'this-page'</script>
  </body>
</html>
